services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultracraft-app
    restart: always
    # Removed exposed ports for Coolify usage
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - db
    networks:
      - ultracraft-network
      - coolify
    labels:
      - "traefik.enable=true"
      # REPLACE 'ultracraft.introvera.com' (and line 33) with your actual domain (e.g., myapp.coolify.io)
      - "traefik.http.routers.ultracraft-app.rule=Host(`ultracraft.introvera.com`)" 
      # Removed explicit entrypoints to allow Traefik to use defaults (http/https/web/websecure)
      - "traefik.http.routers.ultracraft-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.ultracraft-app.loadbalancer.server.port=3000"

  db:
    image: postgres:15-alpine
    container_name: ultracraft-db
    restart: always
    ports:
      - "5432:5432"
    
    # Database uses internal networking only
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ultracraft
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - ultracraft-network

  backup:
    image: prodrigestivill/postgres-backup-local
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ultracraft
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@weekly"      # Run once a week
      BACKUP_KEEP_DAYS: 0      # Disable daily backups
      BACKUP_KEEP_WEEKS: 4     # Keep last 4 weekly backups
      BACKUP_KEEP_MONTHS: 0    # Disable monthly backups
      # S3 / Cloudflare R2 Settings
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION} # usually 'us-east-1' for R2
      S3_ENDPOINT: ${S3_ENDPOINT} # https://<account_id>.r2.cloudflarestorage.com
      S3_S3V4: "yes"
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - ultracraft-network

networks:
  ultracraft-network:
    driver: bridge
  coolify:
    external: true

volumes:
  db-data:
