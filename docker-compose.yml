services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultracraft-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - db
    networks:
      - ultracraft-network
    labels:
      - "traefik.enable=true"
      # REPLACE 'your-domain.com' below with your actual domain (e.g., myapp.coolify.io)
      - "traefik.http.routers.ultracraft-app.rule=Host(`ultracraft.introvera.com`)" 
      - "traefik.http.routers.ultracraft-app.entrypoints=web,websecure"
      - "traefik.http.routers.ultracraft-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.ultracraft-app.loadbalancer.server.port=3000"

  db:
    image: postgres:15-alpine
    container_name: ultracraft-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ultracraft
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ultracraft-network

networks:
  ultracraft-network:
    driver: bridge

volumes:
  db-data:
