services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultracraft-app
    restart: always
    # Removed exposed ports for Coolify usage
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - db
    networks:
      - ultracraft-network
      - coolify
    labels:
      - "traefik.enable=true"
      # REPLACE 'ultracraft.introvera.com' (and line 33) with your actual domain (e.g., myapp.coolify.io)
      - "traefik.http.routers.ultracraft-app.rule=Host(`ultracraft.lk`)" 
      # Removed explicit entrypoints to allow Traefik to use defaults (http/https/web/websecure)
      - "traefik.http.routers.ultracraft-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.ultracraft-app.loadbalancer.server.port=3000"

  db:
    image: postgres:15-alpine
    container_name: ultracraft-db
    restart: always
    
    # Database uses internal networking only
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ultracraft
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - ultracraft-network

  backup:
    image: jkaninda/pg-bkup
    command: backup --storage s3 --cron-expression "@weekly"
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ultracraft
      - DB_USERNAME=user
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_KEEP_DAYS=7
      # S3 / Cloudflare R2 Settings
      - AWS_S3_BUCKET_NAME=${S3_BUCKET}
      - AWS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_REGION=${S3_REGION}
      - AWS_S3_ENDPOINT=${S3_ENDPOINT}
      # jkaninda/pg-backup uses these specific vars
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - ultracraft-network

networks:
  ultracraft-network:
    driver: bridge
  coolify:
    external: true

volumes:
  db-data:
